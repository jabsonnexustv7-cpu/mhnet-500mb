<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Confirmar endereço</title>

<style>

:root{
--bg:#0f172a;
--card:#111827;
--muted:#94a3b8;
--text:#e5e7eb;
--primary:#2563eb;
--primary-hover:#1d4ed8;
--border:rgba(255,255,255,.08);
}

*{box-sizing:border-box;}

body{
margin:0;
font-family:Inter,Arial,sans-serif;
background:linear-gradient(180deg,#0b1220 0%,#0f172a 100%);
color:var(--text);
min-height:100vh;
}

.wrap{
width:min(980px,calc(100vw - 20px));
margin:12px auto 24px;
display:grid;
grid-template-columns:1fr;
gap:14px;
}

.card{
background:rgba(17,24,39,.96);
border:1px solid var(--border);
border-radius:18px;
padding:16px;
box-shadow:0 10px 30px rgba(0,0,0,.22);
}

h1{
font-size:24px;
margin:0 0 6px;
}

.sub{
color:var(--muted);
margin:0 0 16px;
font-size:14px;
}

label{
display:block;
font-weight:600;
margin:14px 0 8px;
font-size:14px;
}

input,textarea,button{font:inherit;}

.field{
width:100%;
border-radius:14px;
border:1px solid rgba(255,255,255,.12);
background:rgba(255,255,255,.04);
color:var(--text);
padding:14px;
outline:none;
}

.actions{
display:grid;
grid-template-columns:1fr;
gap:10px;
margin-top:16px;
}

.btn{
border:0;
border-radius:14px;
padding:14px 18px;
min-height:50px;
cursor:pointer;
font-weight:700;
}

.btn-primary{
background:var(--primary);
color:#fff;
}

.btn-secondary{
background:rgba(255,255,255,.08);
color:var(--text);
}

.map{
width:100%;
height:260px;
border-radius:16px;
overflow:hidden;
border:1px solid rgba(255,255,255,.08);
}

.preview{
width:100%;
border-radius:16px;
margin-top:10px;
display:none;
}

.out{
min-height:140px;
resize:vertical;
}

.status{
min-height:22px;
margin-top:10px;
font-size:14px;
color:var(--muted);
}

.ok{color:#4ade80;}
.err{color:#f87171;}

#payload{display:none;}

</style>
</head>

<body>

<div class="wrap">

<section class="card">

<h1>Confirme seu endereço</h1>

<p class="sub">
Digite o endereço completo com número, selecione a opção correta e confirme no mapa.
</p>

<label>Digite seu endereço</label>

<input
id="addressInput"
class="field"
placeholder="Ex: Rua Coronel Evaristo 1366 Taquara"
/>

<label>Endereço encontrado</label>

<textarea id="obs" class="field out" readonly></textarea>

<div class="actions">

<button id="btnConfirmar" class="btn btn-primary">
Confirmar endereço
</button>

<button id="btnAbrirMaps" class="btn btn-secondary">
Abrir no mapa
</button>

</div>

<div id="status" class="status">
Digite o endereço completo.
</div>

</section>

<aside class="card">

<div id="map" class="map"></div>

<img id="staticPreview" class="preview"/>

<textarea id="payload"></textarea>

</aside>

</div>

<script>

const GOOGLE_MAPS_API_KEY = "AIzaSyAiZg6hvX1FsFBBk6cFHD6tr5bQiBWBF2Q"

const APPS_SCRIPT_WEBHOOK_URL =
"https://script.google.com/macros/s/AKfycby86KFST9SHyU7x_qXqIRbWJOD-VPIi19jsL9c1fr_qtER3GB4bs9g7Lj-069o1IIIyDQ/exec"

const WEBHOOK_SECRET = "webturbo123"

let map
let marker
let geocoder
let autocomplete
let currentPayload = null

const addressInputEl = document.getElementById("addressInput")
const obsEl = document.getElementById("obs")
const statusEl = document.getElementById("status")
const staticPreviewEl = document.getElementById("staticPreview")
const btnConfirmar = document.getElementById("btnConfirmar")
const btnAbrirMaps = document.getElementById("btnAbrirMaps")

function getContactId(){
const url = new URLSearchParams(window.location.search)
return url.get("contact_id") || ""
}

function setStatus(msg,type=""){
statusEl.innerText = msg
statusEl.className = "status"
if(type) statusEl.classList.add(type)
}

function extractComponent(components,type){
const c = components.find(e=>e.types.includes(type))
return c ? c.long_name : ""
}

function buildMapLink(lat,lng){
return "https://www.google.com/maps?q="+lat+","+lng
}

function updatePayload(parts,lat,lng){

const endereco =
parts.route+", "+parts.street_number+
" - "+parts.locality+
" - "+parts.administrative_area_level_1

currentPayload = {
rua:parts.route,
numero:parts.street_number,
cidade:parts.locality,
uf:parts.administrative_area_level_1,
cep:parts.postal_code,
lat,
lng,
maps_link:buildMapLink(lat,lng)
}

obsEl.value = endereco
setStatus("Endereço localizado","ok")
}

function initMiniSite(){

const center={lat:-30.0346,lng:-51.2177}

map=new google.maps.Map(
document.getElementById("map"),
{
center,
zoom:12
}
)

marker=new google.maps.Marker({
position:center,
map
})

geocoder=new google.maps.Geocoder()

autocomplete=new google.maps.places.Autocomplete(
addressInputEl,
{componentRestrictions:{country:"br"}}
)

autocomplete.addListener("place_changed",()=>{

const place=autocomplete.getPlace()

if(!place.geometry) return

const lat=place.geometry.location.lat()
const lng=place.geometry.location.lng()

map.setCenter({lat,lng})
marker.setPosition({lat,lng})

updatePayload(
Object.fromEntries(
place.address_components.map(c=>[c.types[0],c.long_name])
),
lat,
lng
)

})

}

function enviarParaAppsScript(){

const contact_id=getContactId()

if(!contact_id){
setStatus("contact_id não encontrado","err")
return
}

const form=document.createElement("form")

form.method="POST"
form.action=APPS_SCRIPT_WEBHOOK_URL

const fields={
secret:WEBHOOK_SECRET,
contact_id,
payload:JSON.stringify(currentPayload)
}

Object.entries(fields).forEach(([k,v])=>{
const i=document.createElement("input")
i.type="hidden"
i.name=k
i.value=v
form.appendChild(i)
})

document.body.appendChild(form)

form.submit()

}

btnConfirmar.onclick=()=>{

if(!currentPayload){
setStatus("Selecione um endereço primeiro","err")
return
}

btnConfirmar.innerText="Enviando..."

enviarParaAppsScript()

}

btnAbrirMaps.onclick=()=>{
if(!currentPayload) return
window.open(currentPayload.maps_link)
}

window.initMiniSite=initMiniSite

</script>

<script
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAiZg6hvX1FsFBBk6cFHD6tr5bQiBWBF2Q&libraries=places&callback=initMiniSite"
async defer></script>

</body>
</html>
