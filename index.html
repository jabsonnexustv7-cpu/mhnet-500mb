<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WebTurbo Internet Fibra</title>

<style>

body{
font-family:Arial;
margin:0;
background:#020617;
color:white;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:22px;
font-weight:900;
}

.hero{
margin-top:40px;
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
}

.hero h1{
font-size:40px;
}

.card{
background:#0f172a;
padding:25px;
border-radius:18px;
}

input{
width:100%;
padding:12px;
margin-top:8px;
border-radius:10px;
border:none;
}

button{
background:#22c55e;
border:none;
padding:12px;
border-radius:10px;
margin-top:10px;
font-weight:700;
cursor:pointer;
}

.planos{
margin-top:60px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.plano{
background:white;
color:black;
padding:20px;
border-radius:20px;
}

.plano h3{
margin:0;
}

.preco{
font-size:28px;
font-weight:900;
margin:10px 0;
}

.whats{
display:inline-block;
margin-top:15px;
background:#25D366;
color:black;
padding:10px 20px;
border-radius:999px;
font-weight:800;
text-decoration:none;
}

@media(max-width:900px){

.hero{
grid-template-columns:1fr;
}

.planos{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div class="container">

<header>

<div class="logo">
WebTurbo
</div>

<a class="whats" href="https://wa.me/5551999999999">
WhatsApp
</a>

</header>

<section class="hero">

<div>

<h1>
Internet fibra óptica de alta velocidade
</h1>

<p>
Consulte se sua casa tem cobertura e contrate agora mesmo.
</p>

</div>

<div class="card">

<h3>Consultar cobertura</h3>

<input placeholder="Digite seu CEP">

<input placeholder="Número da casa">

<button>
Consultar
</button>

</div>

</section>

<section class="planos">

<div class="plano">

<h3>400 Mega</h3>

<div class="preco">
R$89,90
</div>

<p>
Wi-Fi incluso
</p>

<a class="whats" href="https://wa.me/5551999999999?text=Quero%20400MB">
Contratar
</a>

</div>

<div class="plano">

<h3>500 Mega</h3>

<div class="preco">
R$99,90
</div>

<p>
Mais velocidade para sua casa
</p>

<a class="whats" href="https://wa.me/5551999999999?text=Quero%20500MB">
Contratar
</a>

</div>

<div class="plano">

<h3>600 Mega</h3>

<div class="preco">
R$119,90
</div>

<p>
Ultra velocidade
</p>

<a class="whats" href="https://wa.me/5551999999999?text=Quero%20600MB">
Contratar
</a>

</div>

</section>

</div>

</body>
</html>
