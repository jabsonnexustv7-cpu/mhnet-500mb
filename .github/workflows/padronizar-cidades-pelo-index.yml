name: Padronizar todas as cidades pelo index principal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  padronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Gerar páginas e sitemap usando o index principal
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = process.cwd();
          const sourcePath = path.join(root, "index.html");

          if (!fs.existsSync(sourcePath)) {
            console.error("index.html principal não encontrado.");
            process.exit(1);
          }

          const base = fs.readFileSync(sourcePath, "utf8");

          function titleCaseFromSlug(slug) {
            return slug
              .split("-")
              .filter(Boolean)
              .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
              .join(" ");
          }

          function extractCityData(slug, currentHtml) {
            let cidade = titleCaseFromSlug(slug);
            let uf = "";

            const descMatch = currentHtml.match(/MhNet em\s+(.+?)\s+-\s+([A-Z]{2})\s+com/i);
            if (descMatch) {
              cidade = descMatch[1].trim();
              uf = descMatch[2].trim();
            } else {
              const titleMatch = currentHtml.match(/<title>\s*MhNet\s+(.+?)\s+\|/i);
              if (titleMatch) cidade = titleMatch[1].trim();
            }

            return { cidade, uf, slug };
          }

          function replaceTag(html, pattern, replacement) {
            return html.replace(pattern, replacement);
          }

          function removePlansArrows(html) {
            html = html.replace(/<button[^>]*class="[^"]*plans-arrow[^"]*"[^>]*>[\s\S]*?<\/button>/g, "");
            html = html.replace(/\.plans-arrow[\s\S]*?\}\s*/g, "");
            html = html.replace(/\.plans-arrow-left[\s\S]*?\}\s*/g, "");
            html = html.replace(/\.plans-arrow-right[\s\S]*?\}\s*/g, "");
            html = html.replace(/padding-left:\s*58px;\s*/g, "");
            html = html.replace(/padding-right:\s*58px;\s*/g, "");
            return html;
          }

          function gerar(city) {
            const url = `https://webturbo-internet.com.br/internet-mhnet-${city.slug}/`;
            const title = `Internet MhNet em ${city.cidade} | WebTurbo`;
            const desc = city.uf
              ? `Consulte cobertura MhNet em ${city.cidade} - ${city.uf} com a WebTurbo, agente autorizado. Veja planos de internet fibra e contrate online.`
              : `Consulte cobertura MhNet em ${city.cidade} com a WebTurbo, agente autorizado. Veja planos de internet fibra e contrate online.`;

            let html = base;

            html = replaceTag(html, /<title>[\s\S]*?<\/title>/, `<title>${title}</title>`);
            html = replaceTag(html, /<meta name="description" content="[^"]*" \/>/, `<meta name="description" content="${desc}" />`);
            html = replaceTag(html, /<meta property="og:title" content="[^"]*" \/>/, `<meta property="og:title" content="${title}" />`);
            html = replaceTag(html, /<meta property="og:description" content="[^"]*" \/>/, `<meta property="og:description" content="${desc}" />`);
            html = replaceTag(html, /<meta property="og:url" content="[^"]*" \/>/, `<meta property="og:url" content="${url}" />`);
            html = replaceTag(html, /<meta name="twitter:title" content="[^"]*" \/>/, `<meta name="twitter:title" content="${title}" />`);
            html = replaceTag(html, /<meta name="twitter:description" content="[^"]*" \/>/, `<meta name="twitter:description" content="${desc}" />`);
            html = replaceTag(html, /<link rel="canonical" href="[^"]*" \/>/, `<link rel="canonical" href="${url}" />`);

            html = html.replace(/Planos MhNet Internet/g, `Planos MhNet Internet em ${city.cidade}`);
            html = html.replace(
              /Ofertas disponíveis conforme cobertura e viabilidade técnica no seu endereço\./g,
              city.uf
                ? `Ofertas disponíveis em ${city.cidade} - ${city.uf}, conforme cobertura e viabilidade técnica no seu endereço.`
                : `Ofertas disponíveis em ${city.cidade}, conforme cobertura e viabilidade técnica no seu endereço.`
            );
            html = html.replace(
              /Consulte cobertura MhNet com a WebTurbo, agente autorizado\./g,
              city.uf
                ? `Consulte cobertura MhNet em ${city.cidade} - ${city.uf} com a WebTurbo, agente autorizado.`
                : `Consulte cobertura MhNet em ${city.cidade} com a WebTurbo, agente autorizado.`
            );

            return removePlansArrows(html);
          }

          function gerarSitemap(dirs) {
            const lastmod = new Date().toISOString();
            const urls = [
              { loc: "https://webturbo-internet.com.br/", priority: "1.0" },
              { loc: "https://webturbo-internet.com.br/cidades-atendidas/", priority: "0.9" },
              ...dirs.map((dirName) => ({
                loc: `https://webturbo-internet.com.br/${dirName}/`,
                priority: "0.8"
              }))
            ];

            const body = urls.map((item) => `  <url>\n    <loc>${item.loc}</loc>\n    <lastmod>${lastmod}</lastmod>\n    <changefreq>weekly</changefreq>\n    <priority>${item.priority}</priority>\n  </url>`).join("\n");

            return `<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n${body}\n</urlset>\n`;
          }

          const dirs = fs.readdirSync(root, { withFileTypes: true })
            .filter((entry) => entry.isDirectory() && entry.name.startsWith("internet-mhnet-"))
            .map((entry) => entry.name)
            .sort();

          const updated = [];

          for (const dirName of dirs) {
            const slug = dirName.replace(/^internet-mhnet-/, "");
            const target = path.join(root, dirName, "index.html");
            let currentHtml = "";

            if (fs.existsSync(target)) {
              currentHtml = fs.readFileSync(target, "utf8");
            }

            const city = extractCityData(slug, currentHtml);
            fs.writeFileSync(target, gerar(city), "utf8");
            updated.push(`${dirName}/index.html`);
          }

          fs.writeFileSync(path.join(root, "sitemap.xml"), gerarSitemap(dirs), "utf8");

          console.log("Páginas atualizadas usando o index.html principal como base:");
          for (const item of updated) console.log("- " + item);
          console.log("Total de páginas atualizado:", updated.length);
          console.log("Sitemap refeito com URLs oficiais internet-mhnet-:", dirs.length + 2);
          NODE

      - name: Commitar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "Nenhuma alteração encontrada."
            exit 0
          fi

          git add .
          git commit -m "Padroniza cidades e refaz sitemap oficial"
          git push
