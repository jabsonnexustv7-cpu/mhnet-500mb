          const root = process.cwd();
          const sourcePath = path.join(root, "index.html");

          if (!fs.existsSync(sourcePath)) {
            console.error("index.html principal não encontrado.");
            process.exit(1);
          }

          const base = fs.readFileSync(sourcePath, "utf8");

          function replaceTag(html, pattern, replacement) {
            return html.replace(pattern, replacement);
          }

          function removePlansArrows(html) {
            // Remove botões/setas do carrossel de planos, caso existam em alguma base antiga.
            html = html.replace(/<button[^>]*class="[^"]*plans-arrow[^"]*"[^>]*>[\s\S]*?<\/button>/g, "");

            // Remove CSS específico das setas.
            html = html.replace(/\.plans-arrow[\s\S]*?\}\s*/g, "");
            html = html.replace(/\.plans-arrow-left[\s\S]*?\}\s*/g, "");
            html = html.replace(/\.plans-arrow-right[\s\S]*?\}\s*/g, "");

            // Remove padding extra que havia sido criado para acomodar setas laterais.
            html = html.replace(/padding-left:\s*58px;\s*/g, "");
            html = html.replace(/padding-right:\s*58px;\s*/g, "");

            return html;
          }

          function gerar(city) {
            const url = `https://webturbo-internet.com.br/internet-mhnet-${city.slug}/`;
            const title = `Internet MhNet em ${city.cidade} | WebTurbo`;
            const desc = `Consulte cobertura MhNet em ${city.cidade} - ${city.uf} com a WebTurbo, agente autorizado. Veja planos de internet fibra e contrate online.`;

            let html = base;

            // SEO local
            html = replaceTag(html, /<title>[\s\S]*?<\/title>/, `<title>${title}</title>`);
            html = replaceTag(html, /<meta name="description" content="[^"]*" \/>/, `<meta name="description" content="${desc}" />`);
            html = replaceTag(html, /<meta property="og:title" content="[^"]*" \/>/, `<meta property="og:title" content="${title}" />`);
            html = replaceTag(html, /<meta property="og:description" content="[^"]*" \/>/, `<meta property="og:description" content="${desc}" />`);
            html = replaceTag(html, /<meta property="og:url" content="[^"]*" \/>/, `<meta property="og:url" content="${url}" />`);
            html = replaceTag(html, /<meta name="twitter:title" content="[^"]*" \/>/, `<meta name="twitter:title" content="${title}" />`);
            html = replaceTag(html, /<meta name="twitter:description" content="[^"]*" \/>/, `<meta name="twitter:description" content="${desc}" />`);
            html = replaceTag(html, /<link rel="canonical" href="[^"]*" \/>/, `<link rel="canonical" href="${url}" />`);

            // Personalização visível na seção de planos
            html = html.replace(/Planos MhNet Internet/g, `Planos MhNet Internet em ${city.cidade}`);

            // Personalização do texto de apoio logo abaixo do título de planos
            html = html.replace(
              /Ofertas disponíveis conforme cobertura e viabilidade técnica no seu endereço\./g,
              `Ofertas disponíveis em ${city.cidade} - ${city.uf}, conforme cobertura e viabilidade técnica no seu endereço.`
            );

            // Personalização do bloco de cobertura, quando existir no index principal
            html = html.replace(
              /Consulte cobertura MhNet com a WebTurbo, agente autorizado\./g,
              `Consulte cobertura MhNet em ${city.cidade} - ${city.uf} com a WebTurbo, agente autorizado.`
            );

            // Garante que os cards de planos fiquem sem setas laterais no mobile/desktop.
            html = removePlansArrows(html);

            return html;
          }

          const updated = [];

          for (const city of cities) {
            const dir = path.join(root, `internet-mhnet-${city.slug}`);
            const target = path.join(dir, "index.html");
            fs.mkdirSync(dir, { recursive: true });
            fs.writeFileSync(target, gerar(city), "utf8");
            updated.push(`internet-mhnet-${city.slug}/index.html`);
          }

          console.log("Páginas atualizadas usando o index.html principal como base:");
          for (const item of updated) console.log("- " + item);
          console.log("Total atualizado:", updated.length);
          NODE

      - name: Commitar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "Nenhuma alteração encontrada."
            exit 0
          fi

          git add .
          git commit -m "Padroniza cidades com nome local e remove setas dos planos"
          git push
