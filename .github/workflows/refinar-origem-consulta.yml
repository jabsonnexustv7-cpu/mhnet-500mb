name: Refinar origem consulta WebTurbo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refinar-origem-consulta.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adicionar redundancia de origem no payload de notificacao
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('consultar-cobertura/coverage-base.html')
          s = p.read_text(encoding='utf-8')
          old = '''        origemConsulta,\n        siteOrigem: "webturbo",'''
          new = '''        origemConsulta,\n        origem: origemConsulta,\n        siteOrigem: "webturbo",'''
          if s.count(old) != 1:
              raise SystemExit(f'esperava 1 payload, encontrei {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add consultar-cobertura/coverage-base.html
          git commit -m "Refina origem das notificacoes de cobertura"
          git push
