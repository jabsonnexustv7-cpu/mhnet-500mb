name: Ativar pos-venda WhatsApp WebTurbo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ativar-pos-venda-whatsapp.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar cache bust do script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('consultar-cobertura/index.html')
          s = p.read_text(encoding='utf-8')
          old = '/consultar-cobertura/crm-coordinates-fallback.js?v=1'
          new = '/consultar-cobertura/crm-coordinates-fallback.js?v=2'
          if s.count(old) != 1:
              raise SystemExit(f'Esperava 1 ocorrência de {old}, encontrei {s.count(old)}')
          s = s.replace(old, new, 1)
          old_comment = '<!-- crm-coordinates-fallback-v1 -->'
          new_comment = '<!-- crm-coordinates-fallback-v2 -->\n<!-- post-sale-whatsapp-v1 -->'
          if old_comment in s:
              s = s.replace(old_comment, new_comment, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add consultar-cobertura/index.html
          git commit -m "Ativa redirecionamento robusto pós-venda para WhatsApp"
          git push
