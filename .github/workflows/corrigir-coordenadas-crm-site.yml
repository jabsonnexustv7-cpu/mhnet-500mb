name: Corrigir coordenadas CRM site

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  corrigir:
    if: github.event.issue.title == 'trigger-coordenadas-crm-site'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar fallback das coordenadas da cobertura
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('consultar-cobertura/coverage-base.html')
          s = p.read_text(encoding='utf-8')
          old = '''        coordenadasFixas:        $("mCoordenadasFixas") ? $("mCoordenadasFixas").value.trim() : "",
        coordenadas:             $("mCoordenadasFixas") ? $("mCoordenadasFixas").value.trim() : "",
        coords:                  $("mCoordenadasFixas") ? $("mCoordenadasFixas").value.trim() : "",'''
          new = '''        coordenadasFixas:        $("mCoordenadasFixas") && $("mCoordenadasFixas").value.trim() ? $("mCoordenadasFixas").value.trim() : (modalCoverageData && modalCoverageData.coords ? String(modalCoverageData.coords).trim() : ""),
        coordenadas:             $("mCoordenadasFixas") && $("mCoordenadasFixas").value.trim() ? $("mCoordenadasFixas").value.trim() : (modalCoverageData && modalCoverageData.coords ? String(modalCoverageData.coords).trim() : ""),
        coords:                  $("mCoordenadasFixas") && $("mCoordenadasFixas").value.trim() ? $("mCoordenadasFixas").value.trim() : (modalCoverageData && modalCoverageData.coords ? String(modalCoverageData.coords).trim() : ""),'''
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Bloco alvo: esperava 1 ocorrência, encontrei {count}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit e push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add consultar-cobertura/coverage-base.html
          git commit -m "Grava coordenadas da cobertura no CRM"
          git push origin HEAD:main
